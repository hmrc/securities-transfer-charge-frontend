include "frontend.conf"

appName="securities-transfer-charge-frontend"
first-charging-point="2026-01-01"
play.http.router = prod.Routes

play.http.errorHandler = "uk.gov.hmrc.securitiestransferchargefrontend.handlers.ErrorHandler"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "uk.gov.hmrc.securitiestransferchargefrontend.config.Module"

play.filters.enabled += play.filters.csp.CSPFilter

play.i18n.langs = ["en", "cy"]

microservice {
  save-and-return-uses-user-id-only = false
  services {
      auth {
        protocol = http
        host     = localhost
        port     = 8500
      }

      feedback-frontend {
        protocol = http
        host     = localhost
        port     = 9514
      }

      securities-transfer-charge-save-and-return {
        protocol = http
        host = localhost
        port = 30032
        path = "/securities-transfer-charge-save-and-return"
      }

      address-lookup-frontend {
        protocol = http
        host     = localhost
        port     = 9028
      }
      
      upscan-initiate {
        protocol = http
        host = localhost
        port = 9570
      }

       securities-transfer-charge-frontend {
        protocol = http
        host = localhost
        port = 30036
       }
    }
}

contact-frontend {
  host      = "http://localhost:9250"
  serviceId = "securities-transfer-charge-frontend"
}

timeout-dialog {
  timeout   = 900
  countdown = 120
}

page-refresh {
  spinner {
    interval = 2
    timeout = 10
  }
}

session {
  timeoutSeconds = 900
}

mongodb {
  uri                 = "mongodb://localhost:27017/"${appName}
  timeToLiveInSeconds = 900
  upscanTimeToLiveInHours = 1
  validationErrorTimeToLiveInHours = 1
  checksumTimeToLiveInDays = 30
  parsedStcRowsTimeToLiveInDays = 30
}

alf {
  stf-buyers-config-file = "alf.json"
  stf-seller-config-file = "alf-seller.json"
  stf-agent-seller-config-file = "alf-agent-seller.json"
  stf-org-config-file = "alf-org.json"
  stf-agent-buyer-config-file = "alf-agent-buyer.json"
}

reliefs {
    reliefs-config-file = "reliefs.txt"
}

urls {
  login         = "http://localhost:9949/auth-login-stub/gg-sign-in"
  loginContinue = "http://localhost:30036/securities-transfer-charge-frontend"
  signOut       = "http://localhost:9553/bas-gateway/sign-out-without-state"
  registrationFrontendUrl = "http://localhost:30037/register-securities-transfer-charge"
  continue-url-base = "http://localhost:30036/securities-transfer-charge"

  external {
    connectedPersonsInformation = "https://www.gov.uk/hmrc-internal-manuals/vat-insurance/vatins9000"
    govUK = "https://www.gov.uk"
    reliefsGuidance = "https://www.gov.uk/guidance/stamp-duty-reliefs-and-exemptions-on-paper-shares"
  }
}

host = "http://localhost:30036"

accessibility-statement{
  service-path = "/securities-transfer-charge-frontend"
}

tracking-consent-frontend {
  gtm.container = "transitional"
}

play-frontend-hmrc {
    useRebrand = true
}

features {
  welsh-translation: true
}

file-upload {
  max-rows = 10000
  first-data-row = 4
  max-errors-allowed = 25

  xlsx {
    expected-worksheet = "Sheet1"
    row-cache-size = 100
    buffer-size-bytes = 4096
  }

  templates {
    individual {
      stf {
        expected-columns = 27
        signature = "f61b96a13d50d79f0808a518f4ee26be72e4ae4a7fcb9f1fb4097eb88a82ced5"
      }
    }

    org {
      stf {
        expected-columns = 21
        signature = "c984e157d10aa383165f0669ad15f9fc983093ac17103409837af8e7a04e4eb7"
      }

      sh03 {
          expected-columns = 13
          signature = "9ad8ceb8e8f6929972e71d20893ad9e946e64103ffc70259b6f2588a1644ac1d"
      }
    }

    agent {
        stf {
            expected-columns = 29
            signature = "0642de7e6d677e3db6ff409b968c8d5824003adc1f3b2a6d394d90006ec69de3"
          }

        sh03 {
            expected-columns = 19
            signature = "d7b140cb7787687264ea0f3f65f5f11c8eea068c397031c028f581612dafc7e7"
          }
        }
    }
}
